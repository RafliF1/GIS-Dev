name: Database Backup

on:
  schedule:
    - cron: "0 0 * * *" # Menjalankan setiap pukul 00:00 UTC (07:00 WIB)
  workflow_dispatch: # Memungkinkan menjalankan manual dari tab Actions

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run backup script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx ts-node scripts/backup_all.ts

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add backups/ backup_full_data.json
          git commit -m "Automated backup: $(date +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git push
